  site-url: "https://jongrock17.github.io"
  description: "Jong Rock Jeong is an M.A. student in Political Science and International Relations at Korea University. Research in comparative and historical political economy, state capacity, and political methodology."
  favicon: images/favicon.svg
  open-graph: true
  search: false
  page-navigation: false
  back-to-top-navigation: false
  navbar:
    background: light
    pinned: true
    collapse: true
    left:
      - href: index.qmd
